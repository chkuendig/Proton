name: Build Proton with ZLUDA
on:
  push:
    branches: ['valve/selfcontained-*']
  workflow_dispatch:
    inputs:
      stock_mode:
        type: choice
        options: [off, cold, warm]
        default: off
      stock_seed_run:
        type: string
        default: ''
      stock_seed_artifact:
        type: string
        default: ''
      stock_seed_head:
        description: Exact full producer SHA of the cleared cold seed
        type: string
        default: ''
      stock_seed_digest:
        description: SHA256 of the exact cold seed artifact ZIP
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: zluda-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      actions: read # Read only the explicitly pinned cold seed artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SDK: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64@sha256:97526b794ce1a9bed5f891084462260b3a02399569f7438a3a57b5a253001db9
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_HOME: /work/cargo
      CCACHE_DIR: /work/ccache
      STOCK_MODE: ${{ inputs.stock_mode || 'off' }}
      STOCK_SEED_RUN: ${{ inputs.stock_seed_run }}
      STOCK_SEED_ARTIFACT: ${{ inputs.stock_seed_artifact }}
      STOCK_SEED_DIGEST: ${{ inputs.stock_seed_digest }}
      STOCK_SEED_HEAD: ${{ inputs.stock_seed_head }}
    steps:
      - name: Make room before checkout and SDK pull
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache /usr/local/share/boost
          docker image prune --all --force
          sudo mkdir -p /work
          sudo chown "$USER:$USER" /work
          df -h / /work
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit stock proof inputs
        run: python3 -B .github/proton-stock-artifact.py check
      - name: Checkout pinned public components
        run: |
          git submodule update --init --recursive --depth=1 --filter=blob:none --jobs=3
          git -C zluda lfs pull --include='llvm_zluda/src/device-libs/ockl.bc,ptx/lib/*.bc'
          python3 -m compileall -q make/zluda.py make/zluda-wine-sdk.py tests/zluda proton default_pfx.py
          bash -n make/zluda-build.sh
          python3 tests/zluda/test_policy.py
          python3 tests/zluda/test_patches.py
          python3 -B .github/test_piper_downloads.py
          make --version
          python3 -B tests/zluda/test_stock.py
          python3 -B .github/test_proton_stock_artifact.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: piper-cache
        with:
          path: /work/piper-downloads
          key: piper-downloads-v1-${{ hashFiles('.github/piper-downloads.json') }}
      - name: Prefetch and verify Piper ExternalProject archives
        id: piper-prefetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/piper-downloads.py prepare /work/piper-downloads piper 2>&1 | tee /work/piper-prefetch.log
      - name: Save verified Piper download cache
        if: steps.piper-prefetch.outcome == 'success' && steps.piper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /work/piper-downloads
          key: piper-downloads-v1-${{ hashFiles('.github/piper-downloads.json') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            /work/ccache
            /work/cargo/registry/cache
            /work/cargo/registry/index
          key: zluda-make-v1-${{ hashFiles('make/zluda-deps.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zluda-make-v1-${{ hashFiles('make/zluda-deps.json') }}-
            zluda-make-v1-
      - name: Pull SDK and check capacity
        run: |
          docker pull "$SDK"
          df -h / /work
          test "$(df --output=avail -B1 /work | tail -1)" -ge 51539607552
      - name: Fetch exact successful cold stock seed
        if: env.STOCK_MODE == 'warm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/proton-stock-artifact.py fetch /work/stock-seed
      - name: Build complete redistributable with Proton make
        run: |
          set -euo pipefail
          mkdir -p /work/build /work/cargo /work/ccache
          docker run --rm --memory=10g --cpus=3 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /work:/work \
            -w /work/build -e CARGO_HOME -e CCACHE_DIR -e SDK -e STOCK_MODE \
            "$SDK" bash -euo pipefail -c '
              git config --global --add safe.directory "*"
              ccache --max-size=4G
              # Valve base commit time; component epochs are pinned in rules-zluda.mk.
              args=(-f "$1/Makefile.in" SRCDIR="$1" CONTAINER=1 BUILD_NAME=Proton-ZLUDA INTERNAL_TOOL_NAME=Proton-ZLUDA SOURCE_DATE_EPOCH=1791559305 BASE_SOURCE_DATE_EPOCH=1791559305 -j3)
              reuse=()
              if [ "$STOCK_MODE" != off ]; then
                ccache --show-stats > /work/STOCK-CCACHE-BEFORE.txt
                echo "STOCK_PHASE_BEGIN mode=$STOCK_MODE"
              fi
              if [ "$STOCK_MODE" = cold ]; then
                test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
                mkdir /work/stock-seed
                python3 "$1/make/zluda-stock.py" identity "$1" /work/build /work/stock-seed/STOCK-INPUT-BEFORE.json
                make "${args[@]}" ZLUDA_STOCK_ONLY=1 all-dist
                python3 "$1/make/zluda-wine-sdk.py" /work/build/src-wine /work/build/obj-wine-x86_64 /work/build/zluda-wine-sdk
                python3 "$1/make/zluda-stock.py" export "$1" /work/build /work/stock-seed/stock.tar.gz
                cp STOCK-EXPORT.json /work/stock-seed/STOCK-EXPORT.json
                reuse=(ZLUDA_STOCK_REUSE=1)
              elif [ "$STOCK_MODE" = warm ]; then
                digest=$(sha256sum /work/stock-seed/stock.tar.gz)
                digest=${digest%% *}
                python3 "$1/make/zluda-stock.py" import "$1" /work/build /work/stock-seed/stock.tar.gz "$digest"
                reuse=(ZLUDA_STOCK_REUSE=1)
              fi
              if [ "$STOCK_MODE" != off ]; then echo "STOCK_PHASE_END mode=$STOCK_MODE"; fi
              echo NATIVE_PHASE_BEGIN
              ZLUDA_RUN_PTX_TESTS=1 make "${args[@]}" "${reuse[@]}" zluda
              echo NATIVE_PHASE_END
              sha256sum dist/files/lib64/libcuda.so.1
              rm -rf obj-zluda/target
              df -h .
              make "${args[@]}" "${reuse[@]}" wine
              make "${args[@]}" "${reuse[@]}" zluda-wine
              make "${args[@]}" "${reuse[@]}" redist
              xvfb-run -a make "${args[@]}" "${reuse[@]}" zluda-smoke
              if [ "$STOCK_MODE" != off ]; then
                python3 "$1/make/zluda-stock.py" ready "$1" /work/build
                python3 "$1/make/zluda-stock.py" identity "$1" /work/build /work/STOCK-INPUT-AFTER.json
                cmp /work/stock-seed/STOCK-INPUT-BEFORE.json /work/STOCK-INPUT-AFTER.json
                ccache --show-stats > /work/STOCK-CCACHE-AFTER.txt
              fi
            ' bash "$GITHUB_WORKSPACE" 2>&1 | tee /work/build.log
      - name: Run bridge native unit tests
        run: |
          set -euo pipefail
          docker run --rm --memory=6g --cpus=3 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /work:/work -w /work/build \
            -e CARGO_HOME "$SDK" bash -euo pipefail -c '
              env PATH="/work/build/zluda-deps/rust/bin:$PATH" \
                ZLUDA_WINE_BACKEND_SOURCE="$1/zluda" ZLUDA_WINE_DECLARATIONS_ONLY=1 \
                CARGO_TARGET_DIR=/work/build/bridge-native-tests \
                cargo test --locked --offline -j3 --lib --manifest-path "$1/zluda-wine/wine/zluda_wine/Cargo.toml" -- --test-threads=1
            ' bash "$GITHUB_WORKSPACE" 2>&1 | tee /work/bridge-native-tests.log
      - name: Smoke installed Proton Session and launcher
        run: |
          set -euo pipefail
          docker run --rm --memory=6g --cpus=3 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /work:/work -w /work/build \
            "$SDK" bash -euo pipefail -c '
              xvfb-run -a make -f "$1/Makefile.in" SRCDIR="$1" CONTAINER=1 SOURCE_DATE_EPOCH=1791559305 BASE_SOURCE_DATE_EPOCH=1791559305 -j3 zluda-launcher-smoke
              tar -czf /work/Proton-ZLUDA.tar.gz -C redist .
            ' bash "$GITHUB_WORKSPACE" 2>&1 | tee /work/launcher-smoke.log
      - name: Qualify stock, SDK, binaries and report every full-tree delta
        if: env.STOCK_MODE != 'off'
        run: |
          set -euo pipefail
          docker run --rm --memory=6g --cpus=3 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /work:/work -w /work/build \
            -e SDK -e STOCK_MODE "$SDK" bash -euo pipefail -c '
              git config --global --add safe.directory "*"
              python3 "$1/make/zluda-stock.py" ready "$1" /work/build
              python3 "$1/make/zluda-stock.py" identity "$1" /work/build /work/STOCK-INPUT-AFTER.json
              cmp /work/stock-seed/STOCK-INPUT-BEFORE.json /work/STOCK-INPUT-AFTER.json
              python3 "$1/make/zluda-stock.py" qualification /work/build /work/STOCK-QUALIFICATION.json
              if [ "$STOCK_MODE" = cold ]; then
                cp /work/STOCK-QUALIFICATION.json /work/stock-seed/COLD-QUALIFICATION.json
                cp /work/STOCK-INPUT-AFTER.json /work/stock-seed/STOCK-INPUT-AFTER.json
              else
                python3 "$1/make/zluda-stock.py" compare /work/stock-seed/COLD-QUALIFICATION.json /work/STOCK-QUALIFICATION.json /work/STOCK-COMPARISON.json
                # A green job retains all tests. Registry deltas still require
                # B classification before an equivalence/admission claim.
                cat /work/STOCK-COMPARISON.json
              fi
            ' bash "$GITHUB_WORKSPACE"
      - name: Publish fully tested cold stock seed
        if: env.STOCK_MODE == 'cold' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proton-stock-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: /work/stock-seed/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain stock proof and all unnormalized differences
        if: always() && env.STOCK_MODE != 'off'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proton-stock-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /work/STOCK-*.json
            /work/STOCK-*.txt
            /work/build/STOCK-*.json
          retention-days: 14
      - name: Save compiler and Cargo download cache
        if: always() && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /work/ccache
            /work/cargo/registry/cache
            /work/cargo/registry/index
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload complete tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Proton-ZLUDA
          path: /work/Proton-ZLUDA.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: |
            /work/build.log
            /work/launcher-smoke.log
            /work/bridge-native-tests.log
            /work/piper-prefetch.log
            /work/build/launcher-smoke.json
            /work/build/obj-zluda-wine/artifacts/SHA256SUMS
          retention-days: 14
